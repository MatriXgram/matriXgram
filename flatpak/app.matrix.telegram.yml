app-id: app.matrix.telegram
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: matrix-telegram

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/ccache/cargo
    CARGO_TARGET_DIR: /run/ccache/target
    XDG_CACHE_HOME: /run/build/matrix-telegram/.cache

finish-args:
  - --share=network
  - --share=ipc
  - --socket=session-bus
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --env=GTK_USE_PORTAL=1
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.Settings
  - --talk-name=ca.desrt.dconf
  - --talk-name=org.freedesktop.secrets

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man

modules:
  - name: matrix-telegram
    buildsystem: simple
    build-commands:
      - npm run tauri -- build --no-bundle --config flatpak/tauri.flatpak.conf.json -- --locked --offline
      - install -Dm755 /run/ccache/target/release/matrix-telegram /app/bin/matrix-telegram
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/app.matrix.telegram.png
      - install -Dm644 flatpak/app.matrix.telegram.desktop /app/share/applications/app.matrix.telegram.desktop
      - install -Dm644 flatpak/app.matrix.telegram.metainfo.xml /app/share/metainfo/app.matrix.telegram.metainfo.xml
    sources:
      - type: dir
        path: ..
