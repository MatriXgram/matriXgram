name: 'publish'

on:
  push:
    tags:
      - '*'

jobs:
  cargo-fmt:
    uses: ./.github/workflows/quality-checks.yml
    with:
      check: cargo-fmt

  cargo-clippy:
    uses: ./.github/workflows/quality-checks.yml
    with:
      check: cargo-clippy

  npm-check:
    uses: ./.github/workflows/quality-checks.yml
    with:
      check: npm-check

  publish-tauri-linux:
    needs:
      - cargo-fmt
      - cargo-clippy
      - npm-check
    uses: ./.github/workflows/build-tauri-job.yml
    with:
      platform: 'ubuntu-22.04'
      args: '--bundles deb,rpm'
      rust-targets: ''
      artifact-name: 'matrixgram-linux-x64'
      artifact-path: |
        src-tauri/target/release/bundle/**/*.deb
        src-tauri/target/release/bundle/**/*.rpm
    secrets: inherit

  publish-tauri-windows:
    needs:
      - cargo-fmt
      - cargo-clippy
      - npm-check
    uses: ./.github/workflows/build-tauri-job.yml
    with:
      platform: 'windows-latest'
      args: ''
      rust-targets: ''
      artifact-name: 'matrixgram-windows-x64'
      artifact-path: 'src-tauri/target/release/bundle/**'
    secrets: inherit

  publish-flatpak:
    needs:
      - cargo-fmt
      - cargo-clippy
      - npm-check
    uses: ./.github/workflows/build-flatpak-job.yml
    with:
      manifest-path: 'flatpak/app.matrix.telegram.yml'
      bundle-name: 'MatriXgram.flatpak'
      artifact-name: 'matrixgram-linux-flatpak'
    secrets: inherit

  publish-release:
    needs:
      - publish-tauri-linux
      - publish-tauri-windows
      - publish-flatpak
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: download linux artifact
        uses: actions/download-artifact@v8
        with:
          name: 'matrixgram-linux-x64'
          path: 'release-assets/linux-x64'

      - name: download windows artifact
        uses: actions/download-artifact@v8
        with:
          name: 'matrixgram-windows-x64'
          path: 'release-assets/windows-x64'

      - name: download flatpak artifact
        uses: actions/download-artifact@v8
        with:
          name: 'matrixgram-linux-flatpak'
          path: 'release-assets/linux-flatpak'

      - name: package release assets by package type
        run: bash scripts/package-release-assets.sh "${{ github.ref_name }}"

      - name: remove installer assets from older releases
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentTag = context.ref.replace(/^refs\/tags\//, "");
            const installerAsset = /\.(?:exe|msi|dmg|deb|rpm|flatpak|appimage|app\.tar\.gz)(?:\.tar\.gz)?(?:\.sig)?$/i;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            for (const release of releases) {
              if (release.tag_name === currentTag) continue;

              for (const asset of release.assets) {
                if (!installerAsset.test(asset.name)) continue;
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id,
                });
                core.info(`Removed ${asset.name} from release ${release.tag_name}`);
              }
            }

      - name: publish github release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ format('MatriXgram {0}', github.ref_name) }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-packages/*
          overwrite_files: true
