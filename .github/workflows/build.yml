name: 'build'

on:
  push:
    branches:
      - master

jobs:
  cargo-fmt:
    uses: ./.github/workflows/quality-checks.yml
    with:
      check: cargo-fmt

  cargo-clippy:
    uses: ./.github/workflows/quality-checks.yml
    with:
      check: cargo-clippy

  npm-check:
    uses: ./.github/workflows/quality-checks.yml
    with:
      check: npm-check

  build-tauri-macos:
    needs:
      - cargo-fmt
      - cargo-clippy
      - npm-check
    uses: ./.github/workflows/build-tauri-job.yml
    with:
      platform: 'macos-latest'
      args: '--target aarch64-apple-darwin'
      rust-targets: 'aarch64-apple-darwin'
      artifact-name: 'matrixgram-macos-aarch64'
      artifact-path: 'src-tauri/target/aarch64-apple-darwin/release/bundle/**'
    secrets: inherit

  build-tauri-windows:
    needs:
      - cargo-fmt
      - cargo-clippy
      - npm-check
    uses: ./.github/workflows/build-tauri-job.yml
    with:
      platform: 'windows-latest'
      args: ''
      rust-targets: ''
      artifact-name: 'matrixgram-windows-x64'
      artifact-path: 'src-tauri/target/release/bundle/**'
    secrets: inherit

  build-flatpak:
    needs:
      - cargo-fmt
      - cargo-clippy
      - npm-check
    uses: ./.github/workflows/build-flatpak-job.yml
    with:
      manifest-path: 'flatpak/app.matrix.telegram.yml'
      bundle-name: 'matrixgram-linux-flatpak.flatpak'
      artifact-name: 'matrixgram-linux-flatpak'
    secrets: inherit

